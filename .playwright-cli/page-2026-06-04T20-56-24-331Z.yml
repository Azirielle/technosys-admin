state-save [filename] saves the current storage (authentication) state to a file cookie-list list all cookies (optionally filtered by domain/path) cookie-get <name> get a specific cookie by name cookie-set <name> <value> set a cookie with optional flags cookie-delete <name> delete a specific cookie cookie-clear clear all cookies localstorage-list list all localstorage key-value pairs localstorage-get <key> get a localstorage item by key localstorage-set <key> <value> set a localstorage item localstorage-delete <key> delete a localstorage item localstorage-clear clear all localstorage sessionstorage-list list all sessionstorage key-value pairs sessionstorage-get <key> get a sessionstorage item by key sessionstorage-set <key> <value> set a sessionstorage item sessionstorage-delete <key> delete a sessionstorage item sessionstorage-clear clear all sessionstorage Network: requests list all network requests since loading the page. each request is numbered for use with the `request` command. request <index> show full details (headers, body, response) of a single network request by its number from the `requests` command. request-headers <index> print only the request headers for a single network request by its number from the `requests` command. request-body <index> print only the request body for a single network request by its number from the `requests` command. response-headers <index> print only the response headers for a single network request by its number from the `requests` command. response-body <index> print the response body for a single network request by its number from the `requests` command. textual bodies are inlined; binary bodies are saved to a file and the path is printed. route <pattern> mock network requests matching a url pattern route-list list all active network routes unroute [pattern] remove routes matching a pattern (or all routes) network-state-set <state> set the browser network state to online or offline DevTools: console [min-level] list conso